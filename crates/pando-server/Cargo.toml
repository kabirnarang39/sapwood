[package]
name = "pando-server"
description = "Pando server, regional cache and node daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "pandod"
path = "src/main.rs"

[dependencies]
pando-core.workspace = true
pando-adapters.workspace = true
pando-proto.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["query", "form", "json"] }
base64 = "0.23"
bytes.workspace = true
clap.workspace = true
futures.workspace = true
blake3.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
prost.workspace = true
rusqlite.workspace = true
metrics.workspace = true
jsonwebtoken.workspace = true
reqwest = { workspace = true, features = ["form"] }
lettre.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
metrics-exporter-prometheus.workspace = true
mimalloc.workspace = true
quick_cache.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-stream.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-reflection.workspace = true
tonic-web.workspace = true
tower-http.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
similar.workspace = true
object_store.workspace = true
tempfile.workspace = true
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
tokio = { workspace = true, features = ["test-util"] }
